<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>BMAD Todo App - Minimal</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    ul { padding-left: 0; }
    li { list-style: none; padding: 8px 0; display:flex; gap:8px; align-items:center }
    .done { text-decoration: line-through; color: #888 }
  </style>
</head>
<body>
  <h1>BMAD Todo App - Minimal</h1>
  <form id="form">
    <input id="task" placeholder="New task" />
    <button>Add</button>
  </form>
  <ul id="list"></ul>

  <script>
    const form = document.getElementById('form');
    const taskInput = document.getElementById('task');
    const list = document.getElementById('list');
    let tasks = [];

    function render() {
      list.innerHTML = '';
      tasks.forEach((t, i) => {
        const li = document.createElement('li');
        li.className = t.done ? 'done' : '';
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = t.done;
        cb.addEventListener('change', () => { tasks[i].done = cb.checked; render(); });
        const span = document.createElement('span'); span.textContent = t.text;
        const del = document.createElement('button'); del.textContent = '✖'; del.addEventListener('click', () => { tasks.splice(i,1); render(); });
        li.appendChild(cb); li.appendChild(span); li.appendChild(del);
        list.appendChild(li);
      })
    }

    form.addEventListener('submit', (e) => { e.preventDefault(); if(taskInput.value.trim()){ tasks.push({text:taskInput.value.trim(), done:false}); taskInput.value=''; render(); } });

    // Expose for tests
    window.__bmad_todo = { getTasks: () => tasks, add: (t)=>{ tasks.push({text:t, done:false}); render(); }, toggle: (i)=>{ tasks[i].done = !tasks[i].done; render(); }, clear: ()=>{ tasks = []; render(); } };

    render();
  </script>
</body>
</html>
